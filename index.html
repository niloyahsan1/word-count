<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clean, responsive word and character counter tool.">
    <link rel="website icon" type="image/png" href="./assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Word Counter</title>
</head>

<body>
    <header class="navbar">
        <div class="logo-group">
            <img src="./assets/logo.png" alt="App Logo" class="brand-logo">
            <span class="brand-title">Word Counter</span>
        </div>
        <a href="https://github.com/niloyahsan1/word-count.git" target="_blank" class="github-badge"
            title="View Source on GitHub">
            <img src="./assets/github-logo.webp" id="github" alt="GitHub Repository">
        </a>
    </header>

    <main class="main-wrapper">
        <section class="workspace">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="wordCount">0</span>
                    <span class="stat-label">Total Words</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="charCount">0</span>
                    <span class="stat-label">Total Characters</span>
                </div>
            </div>

            <div class="editor-card">
                <div class="editor-header">
                    <span class="editor-title">Input Text</span>
                    <div class="action-buttons">
                        <button id="copyBtn" class="btn btn-secondary" title="Copy text to clipboard">
                            <span id="copyBtnText">Copy</span>
                        </button>
                        <button id="clearBtn" class="btn btn-ghost" title="Clear input text">
                            <span>Clear</span>
                        </button>
                    </div>
                </div>
                <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
                <div class="editor-footer">
                    <span id="charWithoutSpace">0 characters excluding spaces</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
